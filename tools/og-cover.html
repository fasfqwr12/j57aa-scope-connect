<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OG Cover Render</title>
<style>
  html, body { margin:0; padding:0; }
  .cover {
    width:1200px; height:630px;
    background: radial-gradient(ellipse at 38% 34%, #182231 0%, #0d1420 52%, #07090d 100%);
    color:#e7ebf2;
    font-family:"Segoe UI", system-ui, sans-serif;
    position:relative;
    overflow:hidden;
    display:flex; align-items:center; gap:90px;
    padding:0 110px;
    box-sizing:border-box;
  }
  .cover::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 62% 30%, rgba(255,255,255,.045) 0%, transparent 34%);
    pointer-events:none;
  }
  .ticks { position:absolute; inset:34px; pointer-events:none; }
  .ticks path { stroke:rgba(231,235,242,.22); stroke-width:2.5; fill:none; }
  .emblem { width:250px; height:250px; flex-shrink:0; filter:drop-shadow(0 0 34px rgba(232,69,60,.28)); }
  .text { position:relative; }
  .kicker {
    color:#8792a3; font-size:19px; letter-spacing:6px;
    font-family:Consolas, monospace; margin-bottom:18px;
  }
  .kicker b { color:#ff5040; }
  h1 { margin:0; font-size:76px; line-height:1.04; letter-spacing:-1px; font-weight:800; }
  h1 span { color:#ff5040; }
  .sub {
    margin-top:22px; color:#8792a3; font-size:21px;
    display:flex; align-items:center; gap:12px;
  }
  .sub i { width:44px; height:1px; background:rgba(231,235,242,.25); }
  .foot {
    position:absolute; left:110px; bottom:44px;
    color:#596575; font-family:Consolas, monospace; font-size:15px; letter-spacing:2px;
  }
  .foot b { color:#e8453c; font-weight:400; }
</style>
</head>
<body>
<div class="cover">
  <svg class="ticks" viewBox="0 0 1132 562" preserveAspectRatio="none">
    <path d="M6 56 V16 a10 10 0 0 1 10-10 H56"/>
    <path d="M1076 6 h50 a10 10 0 0 1 10 10 v40"/>
    <path d="M1126 506 v40 a10 10 0 0 1-10 10 h-50"/>
    <path d="M56 556 H16 a10 10 0 0 1-10-10 v-40"/>
  </svg>
  <svg class="emblem" viewBox="0 0 48 48">
    <defs>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="1.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <circle cx="24" cy="24" r="20" fill="none" stroke="#e7ebf2" stroke-width="1.6" opacity=".92"/>
    <path d="M24 4 A20 20 0 0 1 41.3 14" fill="none" stroke="#e8453c" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="24" cy="24" r="14.5" fill="none" stroke="#e7ebf2" stroke-width=".8" opacity=".32"/>
    <path d="M24 2.8v3.4M24 41.8v3.4M2.8 24h3.4M41.8 24h3.4" stroke="#e7ebf2" stroke-width="1.2" opacity=".55"/>
    <path d="M9.9 9.9l1.8 1.8M36.3 36.3l1.8 1.8M38.1 9.9l-1.8 1.8M11.7 36.3l-1.8 1.8" stroke="#e7ebf2" stroke-width=".9" opacity=".3"/>
    <path d="M24 10.5v6.5M24 31v6.5M10.5 24h6.5M31 24h6.5" stroke="#e7ebf2" stroke-width="1.3" opacity=".85"/>
    <circle cx="24" cy="24" r="2.6" fill="#ff5040" filter="url(#glow)"/>
  </svg>
  <div class="text">
    <div class="kicker">J57AA <b>///</b> BLE SCOPE CONFIG</div>
    <h1>Scope<br>Connect<span>.</span></h1>
    <div class="sub"><i></i>Profile · DOPE · HUD · Ballistics</div>
  </div>
  <div class="foot">fasfqwr12.github.io/j57aa-scope-connect <b>///</b> E104-BT5005A READY</div>
</div>
</body>
</html>
