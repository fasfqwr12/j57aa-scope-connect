<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../assets/icon.svg"><title>Scope responsive smoke tests</title>
<style>body{font:14px system-ui;background:#f0efe6;color:#23261a;margin:16px}iframe{display:block;border:1px solid #6b7d4f;height:800px;background:white}li{padding:3px;overflow-wrap:anywhere}.fail{color:#a11}.pass{color:#276536}#result{font-weight:bold}</style>
<h1>响应式离线交互测试</h1><p>只点导航、选择公开固件、取消检测；启动前拦截蓝牙请求。iframe 模拟 CSS 视口，不是真机触摸测试。</p>
<p id="result">运行中</p><details id="test-details"><summary>查看逐项检查结果</summary><ol id="checks"></ol></details><div id="viewport"></div>
<script type="module">
const host = document.querySelector('#viewport'), list = document.querySelector('#checks');
let count = 0, failed = 0;
function check(ok, title) { count++; const li=document.createElement('li'); li.className=ok?'pass':'fail'; li.textContent=(ok?'PASS ':'FAIL ')+title; list.append(li); if(!ok) failed++; }
async function until(test, timeout=12000) { const end=performance.now()+timeout; while(!test()) { if(performance.now()>end) throw new Error('condition timeout'); await new Promise(requestAnimationFrame); } }
const ids=['device','profile','environment','target','hud','sync','upgrade'];
const requested=Number(new URLSearchParams(location.search).get('width'));
const supportedWidths=[320,390,520,521,640,768,900,901,1024,1050,1051,1180,1280,1440];
const widths=supportedWidths.includes(requested)?[requested]:supportedWidths;
const bootstrap = `window.__smoke={deviceRequests:0,errors:[]};
Object.defineProperty(navigator,'bluetooth',{configurable:true,value:{requestDevice(){window.__smoke.deviceRequests++;throw new Error('Hardware prohibited in smoke tests');}}});
window.confirm=()=>false;
Storage.prototype.getItem=()=>null;Storage.prototype.setItem=()=>{};Storage.prototype.removeItem=()=>{};
window.addEventListener('error',e=>window.__smoke.errors.push(e.message||e.target?.src||e.target?.href||'resource error'),true);
window.addEventListener('unhandledrejection',e=>window.__smoke.errors.push(String(e.reason)));`;
try {
 const appUrl=new URL('../index.html',location.href);
 const response=await fetch(appUrl,{cache:'no-store'}); if(!response.ok)throw new Error('App HTTP '+response.status);
 const html=await response.text();
 for(const width of widths) {
  const f=document.createElement('iframe'); f.style.width=width+'px'; f.title='Scope '+width; host.replaceChildren(f);
  const loaded=new Promise((resolve,reject)=>{f.onload=resolve;f.onerror=reject;});
  // The bootstrap runs before any app script, so even startup regressions cannot access BLE.
  f.srcdoc=html.replace('<head>','<head><base href="'+appUrl.href+'"><script>'+bootstrap+'<'+ '/script>'); await loaded;
  const w=f.contentWindow,d=f.contentDocument;
  await until(()=>d.querySelectorAll('#mobile-tabs button').length===7);
  const nav=width<=900?'#mobile-tabs':'#step-list';
  check(d.querySelectorAll(nav+' button').length===7,width+'px 七个导航按钮');
  const go=id=>d.querySelector(nav+' [data-step="'+id+'"]').click();
  const sub=(page,id)=>{if(width<=900)d.querySelector('[data-panel="'+page+'"] [data-mobile-group="'+id+'"]').click();};
  go('device');
  await until(()=>d.body.dataset.page==='device');
  const advanced=d.querySelector('#connection-advanced'), preview=d.querySelector('.preview-rail'), content=d.querySelector('#preview-content'), toggle=d.querySelector('#btn-preview-toggle');
  const visible=el=>!!el.getClientRects().length && w.getComputedStyle(el).visibility!=='hidden';
  check([...d.querySelectorAll('[id]')].length===new Set([...d.querySelectorAll('[id]')].map(el=>el.id)).size,width+'px 页面ID无重复');
  check([...d.styleSheets].some(s=>s.href?.includes('ui-refinement.css?v=quiet-olive-03')),width+'px Quiet Olive 样式已加载');
  check([...d.styleSheets].some(s=>s.href?.includes('mobile-screens.css?v=mobile-screen-04')),width+'px 单屏手机布局资源已加载');
  const header=d.querySelector('.topbar'), brand=d.querySelector('.brand-lockup');
  check(visible(brand) && d.querySelector('h1')?.textContent==='Scope Connect' && !d.querySelector('.edition-tag'),width+'px 单层品牌去除装饰编号');
  check(w.getComputedStyle(header).backgroundColor==='rgb(253, 253, 250)' && header.getBoundingClientRect().height<=80,width+'px 暖白紧凑顶栏');
  const br=brand.getBoundingClientRect(), cr=d.querySelector('#btn-connect').getBoundingClientRect();
  check(br.left>=0 && br.right<=cr.left && cr.right<=w.innerWidth,width+'px 顶栏品牌与连接操作不重叠');
  if(width>900) {
   const buttons=[...d.querySelectorAll('#step-list button')], rects=buttons.map(el=>el.getBoundingClientRect());
   check(rects.every(r=>Math.abs(r.top-rects[0].top)<1) && rects.at(-1).right<=w.innerWidth,width+'px 桌面七项横向导航');
   const rail=d.querySelector('.flow-rail').getBoundingClientRect();
   check(rail.bottom<=d.querySelector('.workspace').getBoundingClientRect().top+1 && rail.height<=56,width+'px 轻量导航在工作区上方');
  }
  check(d.querySelector('.device-identity h3')?.textContent==='J57AA-2000A' && !d.querySelector('.device-art, .hero-name') && d.querySelector('.device-overview').getBoundingClientRect().height<150,width+'px 设备信息条取代宣传大图');
  const uuid=d.querySelector('[data-bind="connection.serviceUuid"]');
  if(width<=900) {
   check(!visible(uuid),width+'px 高级参数不占连接首页');
   sub('device','settings');
   check(advanced.open && visible(uuid) && uuid.closest('details')===advanced,width+'px 参数分组保留高级设置');
   sub('device','connection');
   check(!visible(uuid),width+'px 返回连接组隐藏高级参数');
   const dialog=d.querySelector('#mobile-preview-dialog'), opener=d.querySelector('#btn-mobile-preview');
   check(!dialog.open && !visible(preview),width+'px 手机预览不占主页面高度');
   opener.click();
   check(dialog.open && visible(preview) && !content.hidden,width+'px 手机预览弹窗可打开');
   dialog.querySelector('.mobile-preview-header button').click();
   check(!dialog.open && !visible(preview),width+'px 手机预览弹窗可关闭');
   check(d.documentElement.scrollHeight<=w.innerHeight+1 && d.querySelector('.app-shell').getBoundingClientRect().bottom<=w.innerHeight+1,width+'px 外壳固定一屏');
   check(d.querySelector('#btn-connect').getBoundingClientRect().height>=44,width+'px 连接按钮触摸高度');
  } else {
   check(!advanced.open,width+'px 高级连接参数默认收起');
   advanced.querySelector('summary').click();
   check(advanced.open && visible(uuid) && uuid.closest('details')===advanced,width+'px 高级设置可展开');
   advanced.querySelector('summary').click();
   check(!advanced.open,width+'px 高级设置可收起');
   check(!content.hidden && visible(preview),width+'px 桌面预览默认可见');
  }
  for(const id of ids) {
   const button=d.querySelector(nav+' [data-step="'+id+'"]'); button.click();
   await until(()=>d.querySelector('.section-panel.active')?.dataset.panel===id);
   check(d.querySelectorAll('.section-panel.active').length===1 && button.classList.contains('active'),width+'px '+id+' 切换唯一活动页');
   if(width<=900) {
    await until(()=>{const r=d.querySelector('.section-panel.active').getBoundingClientRect();return r.top<w.innerHeight-80 && r.bottom>0;});
    const r=button.getBoundingClientRect(); check(r.left>=-1 && r.right<=w.innerWidth+1 && r.bottom<=w.innerHeight+1,width+'px '+id+' 导航可见');
   }
   check(d.documentElement.scrollWidth<=w.innerWidth+1,width+'px '+id+' 无横向溢出 '+d.documentElement.scrollWidth+'/'+w.innerWidth);
   const workspace=d.querySelector('.workspace');
   check(workspace.scrollWidth<=workspace.clientWidth+1,width+'px '+id+' 工作区内部无横向溢出 '+workspace.scrollWidth+'/'+workspace.clientWidth);
   check(d.querySelectorAll(nav+' [aria-current="page"]').length===1 && button.getAttribute('aria-current')==='page',width+'px '+id+' 导航辅助状态一致');
   if(width<=900) {
    await new Promise(w.requestAnimationFrame);
    const heading=d.querySelector('#section-title').getBoundingClientRect(), topbar=d.querySelector('.topbar').getBoundingClientRect();
    check(heading.top>=topbar.bottom-1,width+'px '+id+' 标题未被顶栏遮挡');
   }
  }
  check(preview.hidden && !visible(preview),width+'px 升级页不占用预览栏');
  const dock=d.querySelector('.ota-dock'), consoleGrid=d.querySelector('.ota-console');
  if(width<=900) {
   check(d.querySelector('#mobile-upgrade-detect').contains(d.querySelector('.ota-preflight')) && d.querySelector('#mobile-upgrade-file').contains(d.querySelector('.ota-selection')),width+'px 手机检测与文件分组保留原控件');
   const footer=d.querySelector('.mobile-ota-footer');
   check(dock.contains(d.querySelector('#ota-start')) && footer.contains(d.querySelector('#ota-abort')) && footer.contains(d.querySelector('#ota-gate-reason')) && visible(footer),width+'px 手机门禁和中止不随升级分组隐藏');
  } else {
   check(consoleGrid.contains(d.querySelector('.ota-preflight')) && consoleGrid.contains(d.querySelector('.ota-selection')),width+'px 独立检测与固件操作台');
   check(dock.contains(d.querySelector('#ota-start')) && dock.contains(d.querySelector('#ota-abort')) && dock.contains(d.querySelector('#ota-gate-reason')) && !d.querySelector('.ota-selection').contains(dock),width+'px 确认区独立且保留门禁提示');
  }
  check(!d.querySelector('.ota-intro h3, .ota-sequence') && d.querySelectorAll('[data-panel="upgrade"] .step-number').length===3,width+'px 仅保留操作标题避免重复口号');
  const transfer=d.querySelector('#ota-transfer-details'), logs=d.querySelector('#ota-log-details');
  check(!transfer.open && !logs.open,width+'px 参数与日志默认收起');
  sub('upgrade','file');
  transfer.querySelector('summary').click();
  check(transfer.open && visible(d.querySelector('#ota-preset')),width+'px 传输参数可展开');
  transfer.querySelector('summary').click();
  sub('upgrade','execute');
  logs.querySelector('summary').click();
  check(logs.open && visible(d.querySelector('#ota-clear-log')) && visible(d.querySelector('#ota-log-box')),width+'px 完整操作日志可展开');
  logs.querySelector('summary').click();
  check(!transfer.open && !logs.open,width+'px 参数与日志可收起');
  sub('upgrade','detect');
  const preflight=d.querySelector('.ota-preflight').getBoundingClientRect(), selection=d.querySelector('.ota-selection').getBoundingClientRect();
  check(width<=900?visible(d.querySelector('.ota-preflight')) && !visible(d.querySelector('.ota-selection')):width>1050?Math.abs(preflight.top-selection.top)<2:selection.top>=preflight.bottom,width+'px 升级分段响应式布局');
  check(d.querySelector('#ota-main-mode').dataset.mode==='UNKNOWN' && d.querySelector('#ota-slave-mode').dataset.mode==='UNKNOWN',width+'px 未检测状态不显示为已就绪');
  check(d.querySelector('#ota-start').disabled,width+'px 未检测不可升级');
  const query=d.querySelector('#ota-query-status'), notice=d.querySelector('.ota-preflight > .ota-notice');
  const qr=query.getBoundingClientRect(), nr=notice.getBoundingClientRect();
  check(nr.bottom<=qr.top && qr.bottom<=d.querySelector('.ota-board-grid').getBoundingClientRect().top,width+'px 风险说明、检测操作、状态卡片顺序');
  if(width<=520) {
   const tabsTop=d.querySelector('#mobile-tabs').getBoundingClientRect().top;
   check(qr.top>=d.querySelector('.topbar').getBoundingClientRect().bottom && qr.bottom<=tabsTop,width+'px 手机首屏可见检测按钮');
  }
  query.click();
  check(w.__smoke.deviceRequests===0 && !d.querySelector('#ota-query-status').disabled,width+'px 取消查询无蓝牙请求');
  sub('upgrade','file');
  await until(()=>d.querySelector('.ota-online-item'));
  d.querySelector('.ota-online-item').click();
  await until(()=>d.querySelector('#ota-file-meta').textContent.includes('CRC已核对'));
  check(d.querySelector('#ota-start').disabled && d.querySelector('#ota-log-box').textContent.includes('SHA-256'),width+'px 下载核验不绕过状态门禁');
  const selected=d.querySelector('.ota-online-item[aria-pressed="true"]');
  check(!!selected && selected.querySelector('.fw-action').textContent==='已选择' && !!selected.querySelector('.fw-copy strong'),width+'px 固件卡片选中反馈');
  check(d.querySelector('#ota-gate-reason').dataset.state==='blocked',width+'px 下载后仍明确显示升级受限');
  sub('upgrade','execute');
  const start=d.querySelector('#ota-start');
  start.scrollIntoView({block:'center',behavior:'instant'});
  await new Promise(w.requestAnimationFrame);
  const sr=start.getBoundingClientRect(), bottomLimit=width<=900?d.querySelector('#mobile-tabs').getBoundingClientRect().top:w.innerHeight;
  const topLimit=width<=900?d.querySelector('.topbar').getBoundingClientRect().bottom:d.querySelector('.flow-rail').getBoundingClientRect().bottom;
  const hit=d.elementFromPoint(sr.left+sr.width/2,sr.top+sr.height/2);
  check(sr.top>=topLimit && sr.bottom<=bottomLimit && (hit===start || start.contains(hit)),width+'px 滚动后确认按钮不被导航或其他元素遮挡');
  // Deterministic failure: never send this request to a network or device.
  const nativeFetch=w.fetch, feedback=d.querySelector('#ota-feedback');
  w.fetch=async (input,init)=>{
   const url=new w.URL(typeof input==='string'?input:input.url||String(input),appUrl.href);
   return url.pathname.endsWith('.bin')?new w.Response('',{status:503,statusText:'Offline smoke failure'}):nativeFetch.call(w,input,init);
  };
  try {
   sub('upgrade','file');
   selected.click();
   await until(()=>feedback.textContent.includes('HTTP 503') && !query.disabled);
   check(!feedback.hidden && visible(feedback) && logs.open,width+'px 下载失败自动展开日志并显示独立错误');
   check(start.disabled && feedback.dataset.level==='ERR',width+'px 下载失败不解除门禁');
   sub('upgrade','execute');
   check(visible(feedback),width+'px 切换执行区错误仍可见');
   logs.querySelector('summary').click();
   check(!logs.open && visible(feedback) && feedback.textContent.includes('HTTP 503'),width+'px 手动折叠日志不隐藏具体错误');
   logs.querySelector('summary').click();
   d.querySelector('#ota-clear-log').click();
   check(feedback.hidden && !d.querySelector('#ota-log-box').children.length,width+'px 清空记录同时清理错误提示');
   logs.querySelector('summary').click();
  } finally { w.fetch=nativeFetch; }
  check(w.__smoke.deviceRequests===0,width+'px 无硬件访问');
  check(w.__smoke.errors.length===0,width+'px 无运行或资源错误'+(w.__smoke.errors.length?' '+w.__smoke.errors.join('; '):''));
 }
} catch(e) { check(false,e.stack||e.message); }
document.querySelector('#result').textContent=`完成：${count-failed}/${count} 通过，${failed} 失败`;
document.title=failed?'FAIL Scope smoke':'PASS Scope smoke';
</script></html>
